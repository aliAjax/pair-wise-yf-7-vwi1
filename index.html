<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>活字排版工坊</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">本地活字印章排版</p>
          <h1>活字排版工坊</h1>
        </div>
        <div class="top-actions">
          <button id="saveDraftBtn" class="primary">保存草稿</button>
          <button id="exportBtn">导出预览图</button>
          <button id="clearBoardBtn">清空版面</button>
        </div>
      </header>

      <section class="settings-bar" aria-label="版面设置">
        <label>
          纸张
          <select id="paperSize">
            <option value="postcard">明信片</option>
            <option value="bookmark">书签</option>
            <option value="square">方形小笺</option>
          </select>
        </label>
        <label>
          方向
          <select id="flowMode">
            <option value="horizontal">横排</option>
            <option value="vertical">竖排</option>
          </select>
        </label>
        <label>
          网格
          <input id="gridGap" type="range" min="4" max="18" value="8" />
        </label>
        <label>
          作品名
          <input id="workTitle" type="text" placeholder="例：晚风小笺" />
        </label>
      </section>

      <section class="workspace">
        <aside class="panel inventory-panel">
          <div class="panel-head">
            <h2>字模库</h2>
            <span id="inventoryCount"></span>
          </div>
          <form id="typeForm" class="type-form">
            <input id="charInput" maxlength="2" placeholder="字" required />
            <input id="styleInput" placeholder="风格" required />
            <input id="sizeInput" type="number" min="8" max="72" value="24" required />
            <input id="quantityInput" type="number" min="1" max="99" value="3" required />
            <select id="wearInput">
              <option value="新">新</option>
              <option value="微磨">微磨</option>
              <option value="旧痕">旧痕</option>
            </select>
            <button class="primary" type="submit">加入</button>
          </form>
          <div class="filter-row">
            <input id="inventorySearch" type="search" placeholder="搜索字或风格" />
            <select id="styleFilter">
              <option value="all">全部风格</option>
            </select>
            <select id="wearFilter" aria-label="按成色筛选">
              <option value="all">全部成色</option>
              <option value="新">新</option>
              <option value="微磨">微磨</option>
              <option value="旧痕">旧痕</option>
            </select>
          </div>
          <div id="typeList" class="type-list"></div>
        </aside>

        <section class="stage-wrap">
          <div class="status-strip">
            <div>
              <strong id="selectedTypeLabel">未选择字模</strong>
              <span>点击字模后，在版面格子中落字，也可拖拽字模到版面。</span>
            </div>
            <div class="status-badges">
              <div id="lockBadge" class="badge idle">待校对</div>
              <div id="shortageBadge" class="badge ok">数量充足</div>
            </div>
          </div>
          <div id="stage" class="stage" aria-label="排版画布"></div>
        </section>

        <aside class="panel draft-panel">
          <div class="panel-head">
            <h2>草稿与核对</h2>
            <span id="placedCount"></span>
          </div>

          <section class="lock-box" aria-label="送印锁版">
            <div class="lock-head">
              <h3>送印锁版</h3>
              <span id="lockStatusChip" class="lock-chip proofing">待校对</span>
            </div>

            <div id="proofingView">
              <form id="lockForm" class="lock-form">
                <label>
                  印数
                  <input id="printCountInput" type="number" min="1" step="1" placeholder="例：500" inputmode="numeric" />
                </label>
                <label>
                  校对人
                  <input id="proofreaderInput" type="text" maxlength="20" placeholder="例：林师傅" />
                </label>
                <button class="primary" type="submit">锁版送印</button>
              </form>
              <ul id="lockChecklist" class="lock-checklist" aria-label="锁版条件核对"></ul>
              <div id="lockErrors" class="lock-errors" hidden></div>
              <div class="revision-box">
                <div class="revision-head">
                  <h4>改版记录</h4>
                  <button id="clearRevisionsBtn" type="button" class="link-btn">清空记录</button>
                </div>
                <div id="revisionList" class="revision-list"></div>
              </div>
            </div>

            <div id="lockedView" hidden>
              <dl id="lockMeta" class="lock-meta"></dl>
              <p class="lock-hint">
                版面已锁定送印。此时调整作品设置、字模或落字，均须填写改版依据，确认后自动回到待校对；清空改版记录后才能再次锁版。
              </p>
            </div>
          </section>

          <div class="divider"></div>
          <h3>用量统计</h3>
          <div id="usageList" class="usage-list"></div>
          <div class="divider"></div>
          <h3>已保存草稿</h3>
          <div id="draftList" class="draft-list"></div>
        </aside>
      </section>
    </main>

    <div id="revisionModal" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="revisionModalTitle">
        <h3 id="revisionModalTitle">填写改版依据</h3>
        <p class="modal-summary" id="revisionSummary"></p>
        <textarea id="revisionReason" rows="3" placeholder="说明本次改版原因，例：校对发现错字，改排「风」"></textarea>
        <p id="revisionFormHint" class="modal-hint" hidden>请先填写改版依据。</p>
        <div class="modal-actions">
          <button id="revisionCancelBtn" type="button">取消</button>
          <button id="revisionConfirmBtn" class="primary" type="button">确认改版</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
